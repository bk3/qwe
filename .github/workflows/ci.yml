name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal integration)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Installer syntax and integration
        run: |
          sh -n scripts/install.sh scripts/install_test.sh
          sh scripts/install_test.sh
      - name: Cross-build supported platforms
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /tmp/qwe-${target/\//-} ./cmd/qwe
          done
