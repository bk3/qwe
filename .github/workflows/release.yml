name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Verify
        run: |
          go test -race ./...
          go vet ./...
          sh scripts/install_test.sh
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build static release assets
        env:
          QWE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags "-s -w -X main.version=$QWE_TAG" -o "dist/qwe-${target/\//-}" ./cmd/qwe
          done
          cd dist
          sha256sum qwe-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          QWE_TAG: ${{ github.ref_name }}
        run: gh release create "$QWE_TAG" dist/qwe-* dist/checksums.txt --verify-tag --generate-notes
